name: QA Baseline

on:
  pull_request:
  push:
    branches:
      - nightly

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm run test

      - name: Dependency audit
        run: npm run audit:deps

      - name: OWASP SAST (Semgrep)
        run: npm run sast:owasp
